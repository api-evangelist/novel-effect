aid: novel-effect
name: Novel Effect
description: >-
  Novel Effect is a Techstars-backed interactive read-aloud technology company whose
  voice-recognition platform listens as a person reads a children's picture book aloud and
  plays perfectly synchronized music, sound effects, and character voices in response,
  turning any book into an immersive shared experience. Delivered through iOS, Android, and
  web apps, Novel Effect is used by families, teachers, and libraries to make reading aloud
  more engaging for young children. Novel Effect is a consumer and education (EdTech)
  product and does not currently publish a public developer API, SDK, or developer portal.
